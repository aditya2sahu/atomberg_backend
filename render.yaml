databases:
  - name: atomberg-db
    plan: free
    databaseName: atomberg
    user: atomberg

services:
  - type: web
    name: atomberg-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atomberg-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "10000"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Set these to the deployed frontend origin once it exists.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
