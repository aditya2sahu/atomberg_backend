# One command to run the API and its database locally:
#   docker compose up --build
#
# The API lands on http://localhost:8002 — the same port the frontend expects.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atomberg
      POSTGRES_USER: atomberg
      POSTGRES_PASSWORD: atomberg
    # 5433 on the host so this can't collide with a Postgres already running there.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # migrate must not start before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U atomberg -d atomberg"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      # Local-only values. Real secrets come from the host environment in deployment.
      SECRET_KEY: dev-only-not-a-real-secret
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://atomberg:atomberg@db:5432/atomberg
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      PORT: "8000"
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
