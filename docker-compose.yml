# One command to a working app with data:  docker compose up --build
#
# Tables come from schema.sql (Postgres runs it on first init), data comes from
# the CSVs in data/. The Dockerfile itself stays production-shaped — seeding is
# a compose-only concern, since Render's database is loaded by hand.

x-django-env: &django-env
  DEBUG: "True"
  SECRET_KEY: dev-only-not-a-real-secret
  ALLOWED_HOSTS: "*"
  DATABASE_URL: postgresql://atomberg:atomberg@db:5432/atomberg

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: atomberg
      POSTGRES_USER: atomberg
      POSTGRES_PASSWORD: atomberg
    # Postgres runs everything in this directory the first time it initialises,
    # so the tables and indexes come from schema.sql — not from Django.
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atomberg -d atomberg"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Runs once, then exits. --if-empty makes a restart a no-op instead of a
  # second 80k-row import.
  seed:
    build: .
    command: python manage.py load_csv data --if-empty
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      <<: *django-env
      PORT: "8000"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
